<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="POLAQUEST — LKPD digital Pattern Recognition & Abstraction untuk SMP Kelas 8">
<title>POLAQUEST — Detektif Pola & Abstraksi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A; --card:#1E293B; --card2:#243449; --accent:#38BDF8;
  --benar:#22C55E; --salah:#EF4444; --star:#FACC15;
  --text:#F8FAFC; --dim:#CBD5E1; --line:#334155;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:18px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,.font-baloo{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.2}
body.teks-besar{font-size:22.5px}
body.teks-besar .btn{font-size:1.1rem}
#app{max-width:960px;margin:0 auto;padding:1rem 1rem 6rem}
.card{background:var(--card);border-radius:1.5rem;box-shadow:0 10px 25px rgba(0,0,0,.35);padding:1.25rem}
.card+.card{margin-top:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:48px;padding:.75rem 1.15rem;border-radius:1rem;font-weight:700;cursor:pointer;
  border:none;transition:transform .12s ease,filter .12s ease,background .12s ease;
  font-family:inherit;font-size:1rem;color:var(--text);background:var(--card2);text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#0B1220}
.btn-secondary{background:#334155;color:var(--text)}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--card)}
.btn-benar{background:var(--benar);color:#fff}
.btn-salah{background:var(--salah);color:#fff}
.btn-lg{min-height:56px;font-size:1.1rem;padding:1rem 1.5rem}
.btn-block{display:flex;width:100%}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.stack>*+*{margin-top:.75rem}
.muted{color:var(--dim)}
.center{text-align:center}
.title-huge{font-size:clamp(2.2rem,7vw,3.75rem);font-weight:800;
  background:linear-gradient(90deg,var(--accent),var(--star));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.title-lg{font-size:clamp(1.6rem,5vw,2.5rem);font-weight:700;margin:.25rem 0}
.title-md{font-size:clamp(1.25rem,4vw,1.75rem);font-weight:700;margin:.25rem 0}
.info-bar{display:inline-block;padding:.4rem .9rem;border-radius:999px;
  background:var(--card2);color:var(--accent);font-weight:600;font-size:.9rem;margin-bottom:.75rem}
.float-btn{position:fixed;right:12px;z-index:40;width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--card);
  border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:1.25rem;
  box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .12s ease}
.float-btn:hover{background:var(--line)}
.float-btn:active{transform:scale(.92)}
.float-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#floatBtns{position:fixed;bottom:12px;right:12px;z-index:40;display:flex;flex-direction:column;gap:8px}
#floatBtns .float-btn{position:static}
.lang-toggle{background:var(--card);border:1px solid var(--line);border-radius:999px;
  display:flex;overflow:hidden;height:48px}
.lang-toggle button{border:none;background:transparent;color:var(--dim);
  padding:0 .75rem;font-weight:700;cursor:pointer;font-family:inherit;font-size:.85rem}
.lang-toggle button.active{background:var(--accent);color:#0B1220}
.level-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-top:1rem}
@media(min-width:640px){.level-grid{grid-template-columns:1fr 1fr}}
.level-card{padding:1.1rem;border-radius:1.25rem;background:var(--card);
  border:2px solid var(--line);cursor:pointer;transition:transform .15s ease,border-color .15s ease;
  display:flex;gap:1rem;align-items:flex-start;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.level-card:hover:not(.locked){transform:translateY(-3px);border-color:var(--accent)}
.level-card.locked{opacity:.55;cursor:not-allowed}
.level-card .num{font-size:2rem;line-height:1;font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--accent);min-width:2.5rem}
.level-card .stars{font-size:1.1rem;margin-top:.25rem}
.option{display:flex;gap:.75rem;align-items:flex-start;padding:1rem;border-radius:1rem;
  background:var(--card2);border:2px solid transparent;cursor:pointer;transition:all .15s ease;
  text-align:left;width:100%;color:var(--text);font-family:inherit;font-size:1rem;line-height:1.5}
.option:hover:not(:disabled){background:#2E4260}
.option.selected{border-color:var(--accent)}
.option.benar{border-color:var(--benar);background:rgba(34,197,94,.15)}
.option.salah{border-color:var(--salah);background:rgba(239,68,68,.15)}
.option:disabled{cursor:default}
.option .letter{font-weight:800;color:var(--accent);min-width:1.5rem;font-family:'Baloo 2',sans-serif}
.option .lbl{flex:1}
table{width:100%;border-collapse:collapse;font-size:.95rem;overflow:hidden;border-radius:.75rem}
th,td{padding:.65rem .6rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);font-weight:700;color:var(--accent);font-family:'Baloo 2',sans-serif;font-size:.95rem}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:.75rem;border:1px solid var(--line)}
.basket{min-height:110px;border:2px dashed var(--line);border-radius:1rem;padding:.75rem;
  background:rgba(36,52,73,.35);transition:border-color .15s ease,background .15s ease}
.basket.drop-active{border-color:var(--accent);background:rgba(56,189,248,.08)}
.basket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;font-weight:700;font-family:'Baloo 2',sans-serif}
.chip{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .85rem;border-radius:.75rem;
  background:#334155;cursor:pointer;user-select:none;font-weight:600;margin:.25rem;font-size:.95rem;
  border:2px solid transparent;color:var(--text);font-family:inherit;text-align:left;line-height:1.35}
.chip:hover{background:#475569}
.chip.picked{border-color:var(--accent)}
.chip.benar-tag{background:rgba(34,197,94,.25);border-color:var(--benar);cursor:default}
.chip.salah-tag{background:rgba(239,68,68,.25);border-color:var(--salah);cursor:default}
.chip[disabled]{opacity:1}
.pool{min-height:80px;padding:.35rem;border:2px dashed var(--line);border-radius:1rem;background:rgba(15,23,42,.4)}
.stars-bar{font-size:1.6rem;letter-spacing:2px;line-height:1}
.progress-track{background:var(--line);border-radius:999px;height:12px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--star));height:100%;transition:width .4s ease}
.fb{border-radius:1rem;padding:1rem;margin-top:.75rem;font-weight:600;display:flex;gap:.75rem;align-items:flex-start}
.fb.ok{background:rgba(34,197,94,.15);border:1px solid var(--benar);color:#BBF7D0}
.fb.no{background:rgba(239,68,68,.15);border:1px solid var(--salah);color:#FECACA}
.fb.info{background:rgba(56,189,248,.1);border:1px solid var(--accent);color:#BAE6FD}
.fade-in{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:.4}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:1rem;animation:fadeIn .2s ease}
.modal{background:var(--card);border-radius:1.5rem;max-width:640px;width:100%;max-height:85vh;
  overflow-y:auto;padding:1.5rem;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.modal h3{margin:0 0 .75rem;font-size:1.4rem}
.gloss-item{display:flex;gap:.75rem;padding:.6rem;border-bottom:1px solid var(--line);
  align-items:flex-start;flex-wrap:wrap}
.gloss-item .en{color:var(--accent);font-weight:700;font-family:'Baloo 2',sans-serif;min-width:150px}
.gloss-item .id{color:var(--text);flex:1;min-width:140px}
.search-input{width:100%;min-height:48px;padding:.75rem 1rem;border-radius:.75rem;
  background:var(--card2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:1rem}
.search-input:focus{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:110px;padding:.85rem 1rem;border-radius:1rem;background:var(--card2);
  border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:1rem;line-height:1.55;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
.timer-badge{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;
  border-radius:999px;background:var(--card2);color:var(--star);font-weight:700;font-size:.9rem}
.timer-badge.warn{color:#FCA5A5;background:rgba(239,68,68,.15)}
.tooltip{position:relative;display:inline-block;border-bottom:1px dotted var(--accent);cursor:help}
.tooltip:hover::after,.tooltip:focus::after{content:attr(data-tip);position:absolute;left:0;bottom:120%;
  background:#0B1220;color:var(--text);padding:.5rem .75rem;border-radius:.5rem;font-size:.85rem;
  white-space:nowrap;z-index:20;border:1px solid var(--accent)}
.kbd{display:inline-block;padding:.1rem .45rem;background:var(--card2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:.35rem;font-family:ui-monospace,monospace;font-size:.85rem}
footer.app-footer{text-align:center;padding:1rem;color:var(--dim);font-size:.8rem;margin-top:2rem}
@media print{
  body{background:#fff;color:#000}
  #floatBtns,.no-print,.btn{display:none!important}
  .card{box-shadow:none;border:1px solid #ccc;background:#fff;color:#000}
  .muted{color:#333}
  th{background:#eee;color:#000}
}
</style>
</head>

/* ===================== UTILITAS ===================== */
function bi(en, id){
  if (STATE.modeBahasa === "ID") return id;
  if (STATE.modeBahasa === "EN") return en + " (" + id + ")";
  return en + " / " + id;
}
function renderBi(text){
  if (!text) return "";
  return text.replace(/\{\{([^|]+)\|([^}]+)\}\}/g, (m,en,id)=> bi(en,id));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
let audioCtx = null;
function playSound(type){
  if (!STATE.suaraAktif) return;
  try{
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (type === "benar"){
      o.type = "sine"; o.frequency.setValueAtTime(660, now);
      o.frequency.exponentialRampToValueAtTime(990, now+0.12);
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+0.35);
      o.start(now); o.stop(now+0.36);
    } else if (type === "salah"){
      o.type = "square"; o.frequency.setValueAtTime(180, now);
      o.frequency.exponentialRampToValueAtTime(120, now+0.18);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+0.32);
      o.start(now); o.stop(now+0.34);
    } else if (type === "bintang"){
      o.type = "triangle"; o.frequency.setValueAtTime(880, now);
      o.frequency.exponentialRampToValueAtTime(1320, now+0.15);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+0.4);
      o.start(now); o.stop(now+0.42);
    } else {
      o.type = "sine"; o.frequency.setValueAtTime(440, now);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+0.15);
      o.start(now); o.stop(now+0.16);
    }
  }catch(e){ /* abaikan error suara */ }
}

/* ===================== PENYIMPANAN ===================== */
const STORAGE_KEY = "polaquest_progress";
function saveProgress(){
  if (!CONFIG.simpanProgres) return;
  try{
    const data = {
      levelSelesai: STATE.levelSelesai,
      bintang: STATE.bintang,
      jawabanRefleksi: STATE.jawabanRefleksi,
      modeBahasa: STATE.modeBahasa,
      suaraAktif: STATE.suaraAktif,
      teksBesar: STATE.teksBesar,
      timestamp: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadProgress(){
  if (!CONFIG.simpanProgres) return;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.levelSelesai)) STATE.levelSelesai = d.levelSelesai;
    if (d.bintang && typeof d.bintang === "object") STATE.bintang = d.bintang;
    if (d.jawabanRefleksi) STATE.jawabanRefleksi = Object.assign({q0:"",q1:"",q2:""}, d.jawabanRefleksi);
    if (d.modeBahasa && ["ID","EN","DUAL"].includes(d.modeBahasa)) STATE.modeBahasa = d.modeBahasa;
    if (typeof d.suaraAktif === "boolean") STATE.suaraAktif = d.suaraAktif;
    if (typeof d.teksBesar === "boolean") STATE.teksBesar = d.teksBesar;
  }catch(e){}
}
function resetProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  STATE.levelSelesai = [];
  STATE.bintang = {};
  STATE.jawabanRefleksi = {q0:"",q1:"",q2:""};
  STATE.currentLevel = 0;
  STATE.currentSoal = 0;
  STATE.currentSkenario = 0;
  STATE.sortAssign = {};
  STATE.sortChecked = false;
  STATE.sortFeedback = {};
  STATE.screen = "home";
  render();
}
function totalBintang(){
  let t = 0;
  for (const k in STATE.bintang) t += (STATE.bintang[k] || 0);
  return t;
}
function hitungBintang(skor){
  if (skor >= CONFIG.ambangBintang3) return 3;
  if (skor >= CONFIG.ambangBintang2) return 2;
  if (skor >= CONFIG.ambangBintang1) return 1;
  return 0;
}
function bintangStr(n){
  return "⭐".repeat(Math.max(0,Math.min(3,n))) + "☆".repeat(Math.max(0,3-n));
}
function getBadge(total){
  if (total >= 15) return {ikon:"🏆", nama:"Detektif Pola Legendaris", pesan:"Sempurna! Kamu menguasai Pattern Recognition dan Abstraction."};
  if (total >= 10) return {ikon:"🥇", nama:"Detektif Senior", pesan:"Hebat! Naluri polamu sudah tajam."};
  if (total >= 5)  return {ikon:"🥈", nama:"Detektif Mahir", pesan:"Kamu sudah bisa menemukan pola dan menyaring informasi!"};
  return {ikon:"🥉", nama:"Detektif Pemula", pesan:"Kamu baru mulai! Coba lagi, kamu pasti bisa."};
}

  let items = GLOSARIUM.map(([en,id]) =>
    `<div class="gloss-item"><span class="en">${escapeHtml(en)}</span><span class="id">${escapeHtml(id)}</span></div>`
  ).join("");
  showModal(`

        .filter(([en,id]) => !q || en.toLowerCase().includes(q) || id.toLowerCase().includes(q))

  }

  if (n === 1) return true;
  return STATE.levelSelesai.includes(n-1);
}

  const cards = LEVELS.map(L => {
    const unlocked = isLevelUnlocked(L.id);
    const done = STATE.levelSelesai.includes(L.id);
    const b = STATE.bintang[L.id] || 0;
    return `
    <button class="level-card ${unlocked ? "" : "locked"}" ${unlocked ? `data-action="open-level" data-level="${L.id}"` : "disabled"} aria-label="Level ${L.id}: ${escapeHtml(L.nama)}">

    <button class="btn btn-ghost" data-action="go-home">← Beranda</button>

  </div>
  <h2 class="title-lg" style="margin-top:1rem">🗺️ Peta Misi</h2>
  <p class="muted">Selesaikan setiap level untuk mengumpulkan Bintang Pola. Level terbuka berurutan.</p>
  <div class="level-grid">
    ${cards}
    ${refCard}
  </div>
  <div class="center" style="margin-top:1.5rem">
    <button class="btn btn-primary btn-lg" data-action="show-badge">🏅 Lihat Badge Saya</button>
  </div>`;
}

/* ===================== VIEW: LEVEL ===================== */
function currentLevelData(){
  return LEVELS.find(L => L.id === STATE.currentLevel);
}
function viewLevel(){
  if (STATE.currentLevel === 6) return viewReflection();
  const L = currentLevelData();
  if (!L) return viewMap();

  const header = `
  <div class="row" style="justify-content:space-between;align-items:center">
    <button class="btn btn-ghost" data-action="go-map">← Peta</button>
    <div class="stars-bar">⭐ ${totalBintang()} / 15</div>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="info-bar">Level ${L.id} • ${escapeHtml(L.jenis)}</div>
    <h2 class="title-lg" style="margin:.25rem 0">${L.ikon} ${escapeHtml(L.nama)}</h2>
    <p>${renderBi(L.narasi)}</p>
    ${L.tabel ? tabelHtml(L.tabel) : ""}
  </div>`;

  if (L.id === 4) return header + viewLevel4(L);

  const soal = L.soal[STATE.currentSoal];
  const totalSoal = L.soal.length;
  const progress = Math.round((STATE.currentSoal / totalSoal) * 100);
  return header + `
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="muted">Soal ${STATE.currentSoal + 1} dari ${totalSoal}</span>
      <span class="muted">Percobaan: ${STATE.percobaan}/${CONFIG.maksPercobaan}</span>
    </div>
    <div class="progress-track" style="margin:.5rem 0 1rem"><div class="progress-fill" style="width:${progress}%"></div></div>
    <p style="font-weight:700;font-size:1.1rem">${renderBi(soal.pertanyaan)}</p>
    ${soal.tipe === "pg" ? pgHtml(soal) : multiHtml(soal)}
    <div id="fbArea">${fbAreaHtml()}</div>
    <div style="position:sticky;bottom:0;padding-top:1rem;background:linear-gradient(180deg,transparent,var(--card) 30%)">
      ${aksiBawah(soal)}
    </div>
  </div>`;
}

function tabelHtml(t){
  return `<div class="table-wrap" style="margin-top:.75rem">
    <table>
      <thead><tr>${t.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>
      <tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>
  </div>`;
}

function pgHtml(soal){
  const disabled = STATE.showFeedback ? "disabled" : "";
  return `<div class="stack" style="margin-top:1rem">
    ${soal.opsi.map((o,i)=>{
      let cls = "option";
      if (STATE.showFeedback){
        if (o.benar) cls += " benar";
        else if (STATE.selectedPG === i) cls += " salah";
      } else if (STATE.selectedPG === i){
        cls += " selected";
      }
      const letter = String.fromCharCode(65+i);
      return `<button class="${cls}" ${disabled} data-action="pick-pg" data-idx="${i}" aria-label="Pilihan ${letter}">
        <span class="letter">${letter}.</span>
        <span class="lbl">${renderBi(o.text)}</span>
        ${STATE.showFeedback && o.benar ? '<span>✅</span>' : ""}
        ${STATE.showFeedback && !o.benar && STATE.selectedPG===i ? '<span>❌</span>' : ""}
      </button>`;
    }).join("")}
  </div>`;
}

function multiHtml(soal){
  const disabled = STATE.showFeedback ? "disabled" : "";
  return `<div class="stack" style="margin-top:1rem">
    ${soal.opsi.map(o=>{
      const picked = STATE.selectedMulti.includes(o.id);
      let cls = "option" + (picked ? " selected" : "");
      if (STATE.showFeedback){
        const correct = soal.jawaban.includes(o.id);
        if (correct) cls = "option benar";
        else if (picked) cls = "option salah";
        else cls = "option";
      }
      return `<button class="${cls}" ${disabled} data-action="pick-multi" data-id="${o.id}" aria-pressed="${picked}">
        <span class="letter">${picked ? "🔘" : "⚪"}</span>
        <span class="lbl">${escapeHtml(o.label)}</span>
        ${STATE.showFeedback && soal.jawaban.includes(o.id) ? '<span>✅</span>' : ""}
        ${STATE.showFeedback && picked && !soal.jawaban.includes(o.id) ? '<span>❌</span>' : ""}
      </button>`;
    }).join("")}
    <p class="muted" style="font-size:.9rem">Terpilih: ${STATE.selectedMulti.length} dari ${soal.butuh}</p>
  </div>`;
}

function fbAreaHtml(){
  if (!STATE.showFeedback) return "";
  return `<div class="fb ${STATE.fbOk ? "ok" : "no"} fade-in">
    <div style="font-size:1.4rem">${STATE.fbOk ? "✅" : "❌"}</div>
    <div>${renderBi(STATE.fbText)}</div>
  </div>`;
}

function aksiBawah(soal){
  if (!STATE.showFeedback){
    return `<button class="btn btn-primary btn-lg btn-block" data-action="check" id="btnCheck">PERIKSA JAWABAN</button>`;
  }
  const isLast = STATE.currentSoal >= LEVELS.find(L=>L.id===STATE.currentLevel).soal.length - 1;
  return `<button class="btn btn-primary btn-lg btn-block pop" data-action="next">${isLast ? "LIHAT HASIL 🏁" : "LANJUT ➡️"}</button>`;
}

/* ===================== LEVEL 4: SORT ===================== */
function viewLevel4(L){
  const sk = L.skenario[STATE.currentSkenario];
  const progress = Math.round((STATE.currentSkenario / L.skenario.length) * 100);
  const poolCards = sk.kartu.map((k,i)=>{
    const dest = STATE.sortAssign[i] || null;
    if (dest) return "";
    let cls = "chip";
    if (!STATE.sortChecked && STATE.selectedChip === i) cls += " picked";
    return `<button class="${cls}" data-action="pick-chip" data-idx="${i}" draggable="true" data-chip="${i}">${escapeHtml(k.text)}</button>`;
  }).join("");

  const basket = (key, title, emoji) => {
    const items = sk.kartu.map((k,i)=>{
      const dest = STATE.sortAssign[i] || null;
      if (dest !== key) return "";
      let cls = "chip";
      if (STATE.sortChecked){
        const benar = (STATE.sortFeedback[i] === true);
        cls += benar ? " benar-tag" : " salah-tag";
      } else if (STATE.selectedChip === i) {
        cls += " picked";
      }
      const mark = STATE.sortChecked ? (STATE.sortFeedback[i] ? " ✅" : " ❌") : "";
      return `<button class="${cls}" data-action="${STATE.sortChecked ? "" : "return-chip"}" data-idx="${i}" ${STATE.sortChecked ? "disabled" : ""} draggable="${!STATE.sortChecked}">${escapeHtml(k.text)}${mark}</button>`;
    }).join("");
    return `<div class="basket" data-basket="${key}">
      <div class="basket-head"><span>${emoji} ${title}</span><span class="muted" style="font-weight:400;font-size:.85rem">${key==="penting"?"Important":"Not Important"}</span></div>
      <div>${items || '<span class="muted" style="font-size:.85rem">Letakkan kartu di sini</span>'}</div>
    </div>`;
  };

  const allPlaced = sk.kartu.every((_,i)=> STATE.sortAssign[i]);
  const isLast = STATE.currentSkenario >= L.skenario.length - 1;

  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="muted">Skenario ${STATE.currentSkenario + 1} dari ${L.skenario.length}</span>
      <span class="muted">${STATE.sortChecked ? "Sudah diperiksa" : "Belum diperiksa"}</span>
    </div>
    <div class="progress-track" style="margin:.5rem 0 1rem"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="fb info"><div style="font-size:1.4rem">🎯</div><div><b>Tujuan:</b> ${escapeHtml(sk.tujuan)}</div></div>
    <p class="muted" style="margin-top:.75rem;font-size:.95rem">Ketuk kartu untuk memilih, lalu ketuk keranjang tujuan. Kamu juga bisa menyeret (drag) kartunya.</p>
    <div class="pool" data-basket="pool" style="margin-top:.75rem">
      <div class="basket-head"><span>🗂️ Kartu Informasi</span></div>
      ${poolCards || '<span class="muted" style="font-size:.85rem">Semua kartu sudah ditempatkan.</span>'}
    </div>
    <div style="display:grid;grid-template-columns:1fr;gap:.75rem;margin-top:.75rem">
      ${basket("penting","PENTING","🟢")}
      ${basket("tidak","TIDAK PENTING","⚪")}
    </div>
    ${STATE.sortChecked ? `<div class="fb info fade-in" style="margin-top:1rem"><div style="font-size:1.4rem">💡</div><div>${renderBi(sk.penjelasan)}</div></div>` : ""}
    <div style="position:sticky;bottom:0;padding-top:1rem;margin-top:1rem;background:linear-gradient(180deg,transparent,var(--card) 30%)">
      ${STATE.sortChecked
        ? `<button class="btn btn-primary btn-lg btn-block pop" data-action="next-skenario">${isLast ? "LIHAT HASIL 🏁" : "LANJUT ➡️"}</button>`
        : `<button class="btn btn-primary btn-lg btn-block" data-action="check-sort" ${allPlaced ? "" : "disabled"}>${allPlaced ? "PERIKSA" : `Letakkan semua kartu dulu (${sk.kartu.filter((_,i)=>STATE.sortAssign[i]).length}/${sk.kartu.length})`}</button>`}
    </div>
  </div>`;
}

/* ===================== RENDER DISPATCH ===================== */
function render(){
  document.body.classList.toggle("teks-besar", STATE.teksBesar);
  document.documentElement.style.setProperty("--accent", CONFIG.warnaAksen);
  const app = document.getElementById("app");
  let html = "";
  if (STATE.screen === "home") html = viewHome();
  else if (STATE.screen === "map") html = viewMap();
  else if (STATE.screen === "level") html = viewLevel();
  else if (STATE.screen === "result") html = viewResult();
  else if (STATE.screen === "reflection") html = viewReflection();
  else if (STATE.screen === "badge") html = viewBadge();
  else html = viewHome();
  app.innerHTML = html;
  renderFloatBtns();
  window.scrollTo({top:0, behavior:"instant"});
  // Autofocus tombol periksa
  const btn = document.getElementById("btnCheck");
  if (btn) setTimeout(()=>btn.focus(), 80);
}

/* ===================== LOGIKA LEVEL (PG & MULTI) ===================== */
function startLevel(n){
  STATE.currentLevel = n;
  if (n === 6){
    STATE.screen = "reflection";
    render();
    return;
  }
  STATE.currentSoal = 0;
  STATE.currentSkenario = 0;
  STATE.selectedPG = null;
  STATE.selectedMulti = [];
  STATE.percobaan = 0;
  STATE.showFeedback = false;
  STATE.soalskor = [];
  STATE.sortAssign = {};
  STATE.sortChecked = false;
  STATE.sortFeedback = {};
  STATE.screen = "level";
  startTimer();
  render();
}
function startTimer(){
  stopTimer();
  if (!CONFIG.timerAktif) return;
  STATE.timerSisa = CONFIG.durasiTimerDetik;
}
function stopTimer(){
  if (STATE.timerID){ clearInterval(STATE.timerID); STATE.timerID = null; }
}
function pickPG(idx){
  if (STATE.showFeedback) return;
  STATE.selectedPG = idx;
  playSound("klik");
  render();
}
function pickMulti(id){
  if (STATE.showFeedback) return;
  const soal = currentLevelData().soal[STATE.currentSoal];
  const max = soal.butuh;
  const arr = STATE.selectedMulti.slice();
  const pos = arr.indexOf(id);
  if (pos >= 0) arr.splice(pos,1);
  else {
    if (arr.length >= max) arr.shift();
    arr.push(id);
  }
  STATE.selectedMulti = arr;
  playSound("klik");
  render();
}
function checkAnswer(){
  const L = currentLevelData();
  const soal = L.soal[STATE.currentSoal];
  let benar = false;
  let fb = "";
  if (soal.tipe === "pg"){
    if (STATE.selectedPG === null) return;
    const opsi = soal.opsi[STATE.selectedPG];
    benar = !!opsi.benar;
    fb = benar ? soal.fbBenar : soal.fbSalah;
  } else if (soal.tipe === "multi"){
    if (STATE.selectedMulti.length !== soal.butuh) return;
    const jawabSet = new Set(soal.jawaban);
    benar = STATE.selectedMulti.length === jawabSet.size && STATE.selectedMulti.every(x=>jawabSet.has(x));
    fb = benar ? soal.fbBenar : soal.fbSalah;
  }
  STATE.percobaan += 1;
  if (benar){
    const pts = STATE.percobaan === 1 ? 1 : CONFIG.poinPercobaanKedua;
    STATE.soalskor.push(pts);
    STATE.showFeedback = true;
    STATE.fbOk = true;
    STATE.fbText = fb;
    playSound("benar");
  } else if (STATE.percobaan >= CONFIG.maksPercobaan){
    STATE.soalskor.push(0);
    STATE.showFeedback = true;
    STATE.fbOk = false;
    STATE.fbText = soal.fbSalah + " Jawaban yang benar akan ditampilkan pada opsi.";
    playSound("salah");
  } else {
    STATE.showFeedback = true;
    STATE.fbOk = false;
    STATE.fbText = soal.fbSalah + " Kamu masih punya 1 percobaan lagi.";
    playSound("salah");
    // Kembalikan ke mode bisa memilih lagi setelah feedback dibaca
    setTimeout(()=>{
      STATE.showFeedback = false;
      STATE.selectedPG = null;
      STATE.selectedMulti = [];
      render();
    }, 2600);
  }
  render();
}
function nextSoal(){
  const L = currentLevelData();
  if (STATE.currentSoal >= L.soal.length - 1){
    // selesai level
    finishLevel();
    return;
  }
  STATE.currentSoal += 1;
  STATE.selectedPG = null;
  STATE.selectedMulti = [];
  STATE.percobaan = 0;
  STATE.showFeedback = false;
  render();
}
function finishLevel(){
  const L = currentLevelData();
  const total = L.soal.length;
  const benarPoin = STATE.soalskor.reduce((a,b)=>a+b, 0);
  const skor = Math.round((benarPoin / total) * 100);
  const b = hitungBintang(skor);
  STATE.levelSkorAkhir = skor;
  STATE.levelBintangAkhir = b;
  if (!STATE.levelSelesai.includes(L.id)) STATE.levelSelesai.push(L.id);
  if (!STATE.bintang[L.id] || STATE.bintang[L.id] < b) STATE.bintang[L.id] = b;
  saveProgress();
  playSound("bintang");
  STATE.screen = "result";
  render();
}

/* ===================== LOGIKA LEVEL 4 (SORT) ===================== */
function pickChip(idx){
  if (STATE.sortChecked) return;
  STATE.selectedChip = (STATE.selectedChip === idx) ? null : idx;
  playSound("klik");
  render();
}
function assignChip(idx, basket){
  if (STATE.sortChecked) return;
  if (!STATE.sortAssign) STATE.sortAssign = {};
  STATE.sortAssign[idx] = basket;
  STATE.selectedChip = null;
  playSound("klik");
  render();
}
function returnChip(idx){
  if (STATE.sortChecked) return;
  delete STATE.sortAssign[idx];
  STATE.selectedChip = null;
  playSound("klik");
  render();
}
function checkSort(){
  const L = currentLevelData();
  const sk = L.skenario[STATE.currentSkenario];
  const feedback = {};
  let benarCount = 0;
  sk.kartu.forEach((k,i)=>{
    const dest = STATE.sortAssign[i];
    const isPenting = dest === "penting";
    const benar = (isPenting === !!k.penting);
    feedback[i] = benar;
    if (benar) benarCount += 1;
  });
  STATE.sortFeedback = feedback;
  STATE.sortChecked = true;
  STATE.sortSoalskor = STATE.sortSoalskor || [];
  STATE.sortSoalskor.push({benar: benarCount, total: sk.kartu.length});
  playSound(benarCount === sk.kartu.length ? "benar" : "salah");
  render();
}
function nextSkenario(){
  const L = currentLevelData();
  if (STATE.currentSkenario >= L.skenario.length - 1){
    finishLevel4();
    return;
  }
  STATE.currentSkenario += 1;
  STATE.sortAssign = {};
  STATE.sortChecked = false;
  STATE.sortFeedback = {};
  render();
}
function finishLevel4(){
  const L = currentLevelData();
  const all = STATE.sortSoalskor || [];
  let totalBenar = 0, totalKartu = 0;
  all.forEach(x=>{ totalBenar += x.benar; totalKartu += x.total; });
  const skor = totalKartu > 0 ? Math.round((totalBenar / totalKartu) * 100) : 0;
  const b = hitungBintang(skor);
  STATE.levelSkorAkhir = skor;
  STATE.levelBintangAkhir = b;
  if (!STATE.levelSelesai.includes(L.id)) STATE.levelSelesai.push(L.id);
  if (!STATE.bintang[L.id] || STATE.bintang[L.id] < b) STATE.bintang[L.id] = b;
  saveProgress();
  playSound("bintang");
  STATE.screen = "result";
  render();
}

/* ===================== LOGIKA REFLEKSI ===================== */
function saveRefleksi(){
  const status = document.getElementById("refleksiStatus");
  for (let i = 0; i < REFLEKSI.length; i++){
    const t = document.getElementById("refl"+i);
    if (t) STATE.jawabanRefleksi["q"+i] = t.value;
  }
  saveProgress();
  if (status){
    status.innerHTML = `<div class="fb ok fade-in" style="margin-top:1rem"><div style="font-size:1.4rem">✅</div><div>Catatanmu berhasil disimpan di perangkat ini.</div></div>`;
  }
  playSound("benar");
}
function downloadRefleksi(){
  for (let i = 0; i < REFLEKSI.length; i++){
    const t = document.getElementById("refl"+i);
    if (t) STATE.jawabanRefleksi["q"+i] = t.value;
  }
  saveProgress();
  const lines = [];
  lines.push("CATATAN REFLEKSI — POLAQUEST");
  lines.push("Nama Sekolah: " + CONFIG.namaSekolah);
  lines.push("Kelas: " + CONFIG.kelas);
  lines.push("Tanggal: " + new Date().toLocaleString("id-ID"));
  lines.push("");
  REFLEKSI.forEach((q,i)=>{
    lines.push("Pertanyaan " + (i+1) + ": " + q);
    lines.push("Jawaban: " + (STATE.jawabanRefleksi["q"+i] || "(belum diisi)"));
    lines.push("");
  });
  lines.push("Total Bintang: " + totalBintang() + " / 15");
  const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "catatan-polaquest.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  playSound("klik");
}
function finishRefleksi(){
  if (!STATE.levelSelesai.includes(6)) STATE.levelSelesai.push(6);
  saveProgress();
  STATE.screen = "badge";
  render();
}

/* ===================== EVENT DELEGATION ===================== */
document.addEventListener("click", (e)=>{
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.getAttribute("data-action");
  const level = target.getAttribute("data-level");
  const idx = target.getAttribute("data-idx");
  const id = target.getAttribute("data-id");
  const lang = target.getAttribute("data-lang");
  const basket = target.getAttribute("data-basket");

  // klik di luar modal menutup modal
  if (action === "close-modal-bg" && e.target === target){ closeModal(); return; }

  switch(action){
    case "start":
      STATE.levelSelesai = [];
      STATE.bintang = {};
      STATE.currentLevel = 0;
      saveProgress();
      STATE.screen = "map";
      playSound("klik");
      render();
      break;
    case "continue":
      STATE.screen = "map";
      playSound("klik");
      render();
      break;
    case "go-home":
      STATE.screen = "home";
      render();
      break;
    case "go-map":
      STATE.screen = "map";
      render();
      break;
    case "open-level":
      startLevel(parseInt(level,10));
      break;
    case "pick-pg":
      pickPG(parseInt(idx,10));
      break;
    case "pick-multi":
      pickMulti(id);
      break;
    case "check":
      checkAnswer();
      break;
    case "next":
      nextSoal();
      break;
    case "retry-level":
      startLevel(STATE.currentLevel);
      break;
    case "continue-map":
      STATE.screen = "map";
      render();
      break;
    case "pick-chip":
      pickChip(parseInt(idx,10));
      break;
    case "return-chip":
      returnChip(parseInt(idx,10));
      break;
    case "check-sort":
      checkSort();
      break;
    case "next-skenario":
      nextSkenario();
      break;
    case "save-refleksi":
      saveRefleksi();
      break;
    case "download-refleksi":
      downloadRefleksi();
      break;
    case "finish-refleksi":
      finishRefleksi();
      break;
    case "show-badge":
      STATE.screen = "badge";
      render();
      break;
    case "open-glossarium":
      openGlosarium();
      break;
    case "open-help":
      openHelp();
      break;
    case "confirm-reset":
      confirmReset();
      break;
    case "do-reset":
      closeModal();
      resetProgress();
      break;
    case "close-modal":
      closeModal();
      break;
    case "do-print":
      closeModal();
      setTimeout(()=>window.print(), 200);
      break;
    case "open-print":
      openPrint();
      break;
    case "toggle-sound":
      STATE.suaraAktif = !STATE.suaraAktif;
      if (STATE.suaraAktif) playSound("klik");
      saveProgress();
      renderFloatBtns();
      break;
    case "toggle-text":
      STATE.teksBesar = !STATE.teksBesar;
      saveProgress();
      render();
      break;
    case "set-lang":
      STATE.modeBahasa = lang;
      saveProgress();
      render();
      break;
  }

  // Klik pada keranjang level 4
  if (basket && basket !== "pool" && STATE.selectedChip !== null && STATE.selectedChip !== undefined){
    assignChip(STATE.selectedChip, basket);
  }
});

/* ===================== DRAG & DROP LEVEL 4 ===================== */
let dragIdx = null;
document.addEventListener("dragstart", (e)=>{
  const chip = e.target.closest("[data-chip]");
  if (chip){
    dragIdx = parseInt(chip.getAttribute("data-chip"),10);
    try { e.dataTransfer.setData("text/plain", String(dragIdx)); } catch(err){}
    e.dataTransfer.effectAllowed = "move";
  }
});
document.addEventListener("dragover", (e)=>{
  const basket = e.target.closest("[data-basket]");
  if (basket){
    e.preventDefault();
    basket.classList.add("drop-active");
  }
});
document.addEventListener("dragleave", (e)=>{
  const basket = e.target.closest("[data-basket]");
  if (basket) basket.classList.remove("drop-active");
});
document.addEventListener("drop", (e)=>{
  const basket = e.target.closest("[data-basket]");
  if (!basket) return;
  e.preventDefault();
  basket.classList.remove("drop-active");
  if (dragIdx === null) return;
  const key = basket.getAttribute("data-basket");
  if (key === "pool"){
    returnChip(dragIdx);
  } else {
    assignChip(dragIdx, key);
  }
  dragIdx = null;
});

/* ===================== KEYBOARD SHORTCUT ===================== */
document.addEventListener("keydown", (e)=>{
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && STATE.screen === "home"){
    const btn = document.querySelector('[data-action="start"]');
    if (btn && document.activeElement === document.body) btn.click();
  }
});

/* ===================== INIT ===================== */
function init(){
  loadProgress();
  document.documentElement.style.setProperty("--accent", CONFIG.warnaAksen);
  document.body.classList.toggle("teks-besar", STATE.teksBesar);
  render();
}
init();
</script>
